---
- name: Stop and disable Nginx
  systemd:
    name: nginx
    state: stopped
    enabled: false
  ignore_errors: true

- name: Ensure Nginx package is removed
  apt:
    name: nginx
    state: absent
  ignore_errors: true

- name: Ensure app directory exists
  file:
    path: "{{ app_dest }}"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"

- name: Clone/update the application repository
  git:
    repo: "{{ app_repo_url }}"
    dest: "{{ app_dest }}"
    version: "{{ app_repo_version }}"
    force: true
  become_user: ubuntu

- name: Install npm dependencies
  npm:
    path: "{{ app_dest }}/app"
    production: true

- name: Deploy systemd unit for the Node app
  template:
    src: node-app.service.j2
    dest: /etc/systemd/system/node-app.service
    mode: "0644"
  notify: restart node-app

- name: Ensure node-app service is enabled and started
  systemd:
    name: node-app
    state: started
    enabled: true
    daemon_reload: true
