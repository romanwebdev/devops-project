---
- name: Stop and disable old systemd node-app service (replaced by Docker)
  systemd:
    name: node-app
    state: stopped
    enabled: false
  ignore_errors: true

- name: Ensure app directory exists
  file:
    path: "{{ app_dest }}"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"

- name: Log in to GitHub Container Registry
  community.docker.docker_login:
    registry_url: ghcr.io
    username: "{{ ghcr_username }}"
    password: "{{ ghcr_token }}"

- name: Pull the latest application image
  community.docker.docker_image:
    name: "{{ docker_image }}"
    source: pull
    force_source: true

- name: Deploy .env file for the container
  template:
    src: app.env.j2
    dest: "{{ app_dest }}/.env"
    owner: ubuntu
    group: ubuntu
    mode: "0600"

- name: Stop and remove existing container
  community.docker.docker_container:
    name: node-hello-service
    state: absent
  ignore_errors: true

- name: Run the application container
  community.docker.docker_container:
    name: node-hello-service
    image: "{{ docker_image }}"
    state: started
    restart_policy: always
    ports:
      - "80:3000"
    env_file: "{{ app_dest }}/.env"
    env:
      PORT: "3000"
