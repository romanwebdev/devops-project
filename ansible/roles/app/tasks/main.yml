---
- name: Ensure app directory exists
  file:
    path: '{{ app_dest }}'
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0755'

- name: Stop and remove previous standalone container from earlier deploy
  community.docker.docker_container:
    name: node-hello-service
    state: absent
  ignore_errors: true

- name: Ensure secrets directory exists
  file:
    path: '{{ app_dest }}/secrets'
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0700'

- name: Check if Mongo root password already exists
  stat:
    path: '{{ app_dest }}/secrets/mongo_root_password.txt'
  register: mongo_secret_file

- name: Generate Mongo root password if it doesn't exist
  shell: openssl rand -base64 24 > "{{ app_dest }}/secrets/mongo_root_password.txt"
  when: not mongo_secret_file.stat.exists

- name: Secure the secret file permissions
  file:
    path: '{{ app_dest }}/secrets/mongo_root_password.txt'
    owner: ubuntu
    group: ubuntu
    mode: '0644'

- name: Read the generated Mongo root password
  slurp:
    src: '{{ app_dest }}/secrets/mongo_root_password.txt'
  register: mongo_password_raw

- name: Set mongo_root_password fact
  set_fact:
    mongo_root_password: '{{ mongo_password_raw.content | b64decode | trim }}'

- name: Check if active-color file exists
  stat:
    path: '{{ app_dest }}/active_color'
  register: active_color_file

- name: Initialize active color to blue on first deploy
  copy:
    content: 'blue'
    dest: '{{ app_dest }}/active_color'
    owner: ubuntu
    group: ubuntu
  when: not active_color_file.stat.exists

- name: Read current active color
  slurp:
    src: '{{ app_dest }}/active_color'
  register: active_color_raw

- name: Set active_color fact
  set_fact:
    active_color: '{{ active_color_raw.content | b64decode | trim }}'

- name: Stop and remove old single-container api service (pre blue-green)
  community.docker.docker_container:
    name: app-api-1
    state: absent
  ignore_errors: true

- name: Deploy production docker-compose.yml
  template:
    src: docker-compose.prod.yml.j2
    dest: '{{ app_dest }}/docker-compose.yml'
    owner: ubuntu
    group: ubuntu
    mode: '0644'

- name: Deploy Nginx config
  template:
    src: nginx.conf.j2
    dest: '{{ app_dest }}/nginx.conf'
    owner: ubuntu
    group: ubuntu
    mode: '0644'
  notify: restart nginx

- name: Deploy blue-green switch script
  template:
    src: deploy-blue-green.sh.j2
    dest: '{{ app_dest }}/deploy-blue-green.sh'
    owner: ubuntu
    group: ubuntu
    mode: '0755'

- name: Deploy .env file for the application
  template:
    src: app.env.j2
    dest: '{{ app_dest }}/.env'
    owner: ubuntu
    group: ubuntu
    mode: '0600'

- name: Pull latest images
  command: docker compose pull
  args:
    chdir: '{{ app_dest }}'

- name: Start application stack
  command: docker compose up -d --remove-orphans
  args:
    chdir: '{{ app_dest }}'
