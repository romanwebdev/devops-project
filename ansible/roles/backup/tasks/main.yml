---
- name: Ensure unzip is available
  apt:
    name: unzip
    state: present
    update_cache: true

- name: Check if AWS CLI is already installed
  command: aws --version
  register: aws_cli_check
  failed_when: false
  changed_when: false

- name: Download AWS CLI v2 installer
  get_url:
    url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
    dest: /tmp/awscliv2.zip
  when: aws_cli_check.rc != 0

- name: Unzip AWS CLI installer
  unarchive:
    src: /tmp/awscliv2.zip
    dest: /tmp
    remote_src: true
  when: aws_cli_check.rc != 0

- name: Install AWS CLI
  command: /tmp/aws/install
  when: aws_cli_check.rc != 0

- name: Ensure .aws directory exists
  file:
    path: /home/ubuntu/.aws
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0700'

- name: Deploy AWS credentials file
  template:
    src: aws_credentials.j2
    dest: /home/ubuntu/.aws/credentials
    owner: ubuntu
    group: ubuntu
    mode: '0600'

- name: Deploy AWS config file (region)
  template:
    src: aws_config.j2
    dest: /home/ubuntu/.aws/config
    owner: ubuntu
    group: ubuntu
    mode: '0600'

- name: Deploy backup script
  template:
    src: backup-mongo.sh.j2
    dest: '{{ app_dest }}/backup-mongo.sh'
    owner: ubuntu
    group: ubuntu
    mode: '0755'

- name: Schedule backup cron job every 12 hours
  cron:
    name: 'MongoDB backup to S3'
    user: ubuntu
    minute: '0'
    hour: '0,12'
    job: '{{ app_dest }}/backup-mongo.sh >> {{ app_dest }}/backup.log 2>&1'
